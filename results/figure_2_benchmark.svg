<title id="title">Synthetic benchmark ranking quality</title><desc id="desc">Mean NDCG at 20 percent across ten synthetic random seeds: benefit-cost heuristic 0.784, data-driven AI 0.963, knowledge rules 0.971, knowledge-guided hybrid 0.974. Error bars are one standard deviation.</desc>
