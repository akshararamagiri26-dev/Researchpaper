<title id="title">Synthetic benchmark ranking quality</title><desc id="desc">Mean NDCG at 20 percent across ten synthetic random seeds: benefit-cost heuristic 0.784 plus or minus 0.048, data-driven AI 0.963 plus or minus 0.009, knowledge rules 0.971 plus or minus 0.006, knowledge-guided hybrid 0.974 plus or minus 0.004. Error bars are one standard deviation.</desc>
