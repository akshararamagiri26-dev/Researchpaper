<rect x="500" y="200" width="330" height="140" rx="20" fill="#eef4fb" stroke="#315b82" stroke-width="3"/>
<text x="665" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2937">Knowledge score</text><text x="665" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">Explicit weighted rules</text>
<rect x="500" y="390" width="330" height="140" rx="20" fill="#eef4fb" stroke="#315b82" stroke-width="3"/>
<text x="665" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2937">Predictive model</text><text x="665" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">Random-forest regression</text>
<path d="M835 270 H900 V355 H940 M835 460 H900 V385 H940" stroke="#596579" stroke-width="5" fill="none" stroke-linejoin="round"/><path d="M927 342 L943 355 L927 368 M927 372 L943 385 L927 398" stroke="#596579" stroke-width="5" fill="none"/>
<rect x="950" y="270" width="270" height="200" rx="22" fill="#e7f5ef" stroke="#26745a" stroke-width="3"/>
<text x="1085" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2937">Hybrid ranking</text><text x="1085" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">Validation-tuned weight</text><text x="1085" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">Human review retained</text>
<path d="M1225 370 H1280" stroke="#596579" stroke-width="5" fill="none"/><path d="M1267 357 L1283 370 L1267 383" stroke="#596579" stroke-width="5" fill="none"/>
