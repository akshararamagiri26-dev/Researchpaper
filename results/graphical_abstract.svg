<text x="1410" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#7c4a03">Held-out</text><text x="1410" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#7c4a03">evaluation</text><text x="1410" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#7c4a03">NDCG • regret • ρ</text>
<rect x="110" y="610" width="1380" height="150" rx="24" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
<text x="800" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1f2937">Evidence boundary</text>
<text x="800" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#374151">Ten-seed synthetic benchmark verifies the evaluation pipeline only.</text>
<text x="800" y="740" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#374151">Real-world effectiveness and novelty require independent validation.</text>
