<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Graphical abstract: transparent ranking protocol for digital transformation initiatives</title>
<desc id="desc">Six decision attributes feed an explicit knowledge score and a random forest predictor. A validation partition selects the mixture weight, and the held-out test partition evaluates top-k ranking. Synthetic results are a pipeline demonstration only.</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#1f2937">A transparent protocol for knowledge-guided ranking</text>
<text x="800" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#4b5563">Digital-transformation initiative prioritization</text>
<rect x="70" y="220" width="340" height="300" rx="24" fill="#eef4fb" stroke="#315b82" stroke-width="3"/>
<text x="240" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f2937">Decision attributes</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#1f2937">
<text x="110" y="325">• Strategic alignment</text><text x="110" y="365">• Data readiness</text><text x="110" y="405">• Digital capability</text><text x="110" y="445">• Expected benefit</text><text x="110" y="485">• Cost and implementation risk</text>
</g>
