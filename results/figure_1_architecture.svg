<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
<title id="title">Knowledge-guided decision-support architecture</title><desc id="desc">Five connected stages from organizational data through knowledge rules, predictive AI, ranking and explanation, to managerial decision and feedback. Governance spans the full pipeline.</desc>
<rect width="1600" height="440" fill="#ffffff"/>
<text x="800" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1f2937">Knowledge-guided decision-support pipeline</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="40" y="115" width="260" height="135" rx="18" fill="#eef4fb" stroke="#315b82" stroke-width="3"/><text x="170" y="168" font-size="23" font-weight="700" fill="#1f2937">Organizational</text><text x="170" y="200" font-size="23" fill="#1f2937">data</text>
<rect x="350" y="115" width="260" height="135" rx="18" fill="#eef4fb" stroke="#315b82" stroke-width="3"/><text x="480" y="168" font-size="23" font-weight="700" fill="#1f2937">Knowledge layer</text><text x="480" y="200" font-size="20" fill="#1f2937">Rules + constraints</text>
<rect x="660" y="115" width="260" height="135" rx="18" fill="#eef4fb" stroke="#315b82" stroke-width="3"/><text x="790" y="168" font-size="23" font-weight="700" fill="#1f2937">Predictive AI</text><text x="790" y="200" font-size="20" fill="#1f2937">Model + validation</text>
<rect x="970" y="115" width="260" height="135" rx="18" fill="#e7f5ef" stroke="#26745a" stroke-width="3"/><text x="1100" y="168" font-size="23" font-weight="700" fill="#1f2937">Knowledge-guided</text><text x="1100" y="200" font-size="20" fill="#1f2937">Ranking + explanation</text>
<rect x="1280" y="115" width="280" height="135" rx="18" fill="#e7f5ef" stroke="#26745a" stroke-width="3"/><text x="1420" y="168" font-size="23" font-weight="700" fill="#1f2937">Managerial decision</text><text x="1420" y="200" font-size="20" fill="#1f2937">+ feedback</text>
</g>
